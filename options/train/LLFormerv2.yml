name: LLFormerv2-LOLv1
model_type: ImageRestorationModel
scale: 1
num_gpu: 1 # useless when distributed
manual_seed: 1234
print_network: false
find_unused_parameters: True

datasets:
  train:
    name: lol-train
    type: PairedImageDataset
    dataroot_gt: /mnt/data/shenglong/data/LOL/our485/high
    dataroot_lq: /mnt/data/shenglong/data/LOL/our485/low

    # name: MIT5k-train
    # type: PairedImageDataset
    # dataroot_gt: /mnt/data/shenglong/data/MIT-Adobe-5K-512/train/high
    # dataroot_lq: /mnt/data/shenglong/data/MIT-Adobe-5K-512/train/low

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 128
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    pin_memory: false
    prefetch_mode: ~

  val:
    name: lol-test
    type: PairedImageDataset
    dataroot_gt: /mnt/data/shenglong/data/LOL/eval15/high
    dataroot_lq: /mnt/data/shenglong/data/LOL/eval15/low

    # name: MIT-5k-test
    # type: PairedImageDataset
    # dataroot_gt: /mnt/data/shenglong/data/MIT-Adobe-5K-512/test/high
    # dataroot_lq: /mnt/data/shenglong/data/MIT-Adobe-5K-512/test/low

    io_backend:
      type: disk

network_g:
  type: LLFormerv2
  inp_channels: 3
  out_channels: 3
  dim: 16
  num_enc_blocks: [2,4,4]
  num_dec_blocks: [4,4,2]
  num_bottleneck_blocks: 2
  num_extraction_blocks: 1
  num_latent_blocks: 1
  num_refinement_blocks: 2
  heads: [1,2,4,8,8]
  num_slots: [64,64,64,64,64]
  ffn_expansion_factor: 2.66
  bias: False
  shortcut: False

# path
path:
  pretrain_network_g: ~
  strict_load_g: false
  resume_state: ~

# training settings
train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    betas: [0.9, 0.999]
    eps: !!float 1e-8

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 300000
    eta_min: !!float 1e-6

  total_iter: 300000
  warmup_iter: -1 # no warm up

  # losses
  pixel_opt:
    type: SmoothL1Loss
    loss_weight: 1

  mixing_augs:
    mixup: false

  freeze_except_adapter: false

# validation settings
val:
  val_freq: !!float 500
  save_img: false
  padding: true
  padding_factor: 16

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
      save_best_checkpoint: true

# logging settings
logger:
  print_freq: 250
  save_checkpoint_freq: !!float 1e4
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500